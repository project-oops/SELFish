[package]
name = "selfish-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Command-line access to the formats the SELFish crates read and write"

[[bin]]
name = "selfish"
path = "src/main.rs"

# Only a Windows executable can carry an icon, so the dependency is not built elsewhere.
[target.'cfg(windows)'.build-dependencies]
winresource.workspace = true

[build-dependencies]
oops-build.workspace = true

[dependencies]
oops-build.workspace = true
selfish-bytes.workspace = true
selfish-abi.workspace = true
selfish-elf.workspace = true
selfish-container.workspace = true
selfish-nid.workspace = true
selfish-title.workspace = true
selfish-pfs.workspace = true
selfish-pkg.workspace = true
selfish-shader.workspace = true
clap.workspace = true
png.workspace = true

[lints]
workspace = true
