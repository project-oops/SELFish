[workspace]
resolver = "3"
members = [
    "crates/selfish-bytes",
    "crates/selfish-abi",
    "crates/selfish-nid",
    "crates/selfish-elf",
    "crates/selfish-container",
    "crates/selfish-title",
    "crates/selfish-pfs",
    "crates/selfish-pkg",
    "crates/selfish-shader",
    "selfish-cli",
]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/project-oops/SELFish"
rust-version = "1.85"
publish = false

# The library crates, in dependency order; the spine is described in CLAUDE.md. Only `pkg`
# takes the cipher crates, so a loader that stops at `elf` compiles none of them.
[workspace.dependencies]
selfish-bytes = { path = "crates/selfish-bytes" }
selfish-abi = { path = "crates/selfish-abi" }
selfish-nid = { path = "crates/selfish-nid" }
selfish-elf = { path = "crates/selfish-elf" }
selfish-container = { path = "crates/selfish-container" }
selfish-title = { path = "crates/selfish-title" }
selfish-pfs = { path = "crates/selfish-pfs" }
selfish-pkg = { path = "crates/selfish-pkg" }
selfish-shader = { path = "crates/selfish-shader" }

# The build stamp on `selfish --version`. Only the CLI takes it; the library crates depend on
# nothing outside this repository.
oops-build = { path = "../oops-libs/crates/oops-build" }

# Validates size and alignment before a reference exists, so parsing needs no `unsafe`.
zerocopy = { version = "0.8", features = ["derive"] }

# The import hash.
sha1 = "0.10"

# The package crypto chain. `num-bigint` rather than an RSA crate: the need is one modular
# exponentiation with a key already in hand.
num-bigint = "0.4"
sha2 = "0.10"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
hmac = "0.12"
flate2 = "1"

# Decode, composite and encode the PNG artwork a title carries. (D073)
png = "0.17"

# The Windows executable's icon, as a build dependency.
winresource = "0.1"

# `param.json`.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# The CLI's arguments.
clap = { version = "4", features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# A builder is arithmetic on offsets, and a loader reports a container wrong by one byte as
# "not a container", not as an offset error.
arithmetic_side_effects = "warn"
indexing_slicing = "warn"
unwrap_used = "warn"
missing_errors_doc = "warn"
missing_panics_doc = "warn"
