name: ci

# Each job checks out the collection, this repository into it, then the siblings this project
# needs (oops-libs, for the CLI's build stamp).

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gate:
    name: fmt, clippy, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/OOPS
          path: OOPS
      - uses: actions/checkout@v4
        with:
          path: OOPS/selfish

      - name: Siblings this build needs
        run: OOPS/bin/oops bootstrap selfish
        env:
          OOPS_CI_TOKEN: ${{ secrets.OOPS_CI_TOKEN }}

      # The linker tests skip without clang and lld, which would leave them checking nothing.
      - name: Install clang and lld
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang lld

      # `./bin/selfish check`: formatting, clippy at `-D warnings`, the tests and a doc build.
      - name: oops check selfish
        run: OOPS/bin/oops check selfish

      # Not in the local gate: it only matters on a machine that might lack the linker.
      - name: The linker tests really ran
        run: ./bin/selfish links
        working-directory: OOPS/selfish

  provenance:
    name: every format table names its sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/OOPS
          path: OOPS
      - uses: actions/checkout@v4
        with:
          path: OOPS/selfish

      - name: format tables name their sources, and no material is committed
        run: |
          ./bin/selfish provenance
          echo "no material committed"
        working-directory: OOPS/selfish
