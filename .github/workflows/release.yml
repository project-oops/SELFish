name: Release

# Archives of the `selfish` command line, per platform.
#
#   push to main      -> build, refresh the rolling `latest-main` release
#   push to a v* tag  -> build, create a draft versioned release
#   workflow_dispatch -> manual draft with the given tag
#
# Archives use stable, version-less filenames so a link can survive release to release.
#
# Every job begins the standard OOPS preamble: check out the collection, check this repository
# out *into* it, then `oops bootstrap`. `selfish-cli` resolves `oops-libs` by relative path, so
# a flat checkout fails as a missing directory rather than as a missing dependency - the
# libraries under `crates/` still take nothing, which is the property this repository exists to
# hold and the reason that qualification matters.
#
# **No `clang` or `lld` here, deliberately.** Two integration tests link a real module and need
# them, and `ci.yml` installs them for that reason - but a release only builds, and adding a
# toolchain a build does not use is a dependency that fails one day for no reason anybody can
# trace back.

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - "README.md"
      - "docs/**"
      - "LICENSE-*"
      - ".gitignore"
      - ".gitattributes"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0)"
        required: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            target: x86_64-pc-windows-msvc
            suffix: .exe
            archive: zip
            friendly: windows
          - name: Linux
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            suffix: ""
            archive: tar.gz
            friendly: linux
          - name: macOS
            os: macos-latest
            target: aarch64-apple-darwin
            suffix: ""
            archive: tar.gz
            friendly: macos
    # `bash` on every platform. The entry points are bash scripts and `OOPS/bin/oops` has no
    # extension, so under the Windows runner's default PowerShell it is not an executable at
    # all. The `Pack (zip)` step overrides this.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/OOPS
          path: OOPS
      - uses: actions/checkout@v4
        with:
          path: OOPS/selfish
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: OOPS/selfish
          key: release-${{ matrix.friendly }}

      - name: Siblings this build needs
        run: OOPS/bin/oops bootstrap selfish
        env:
          # Empty unless the org secret exists, and empty is the old behaviour.
          OOPS_CI_TOKEN: ${{ secrets.OOPS_CI_TOKEN }}

      - name: Resolve tag
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ inputs.tag }}"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
          else
            tag="main-$(echo "$GITHUB_SHA" | cut -c1-7)"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "staged=selfish-${tag}-${{ matrix.friendly }}" >> "$GITHUB_OUTPUT"

      # Through the front door, so this and `./bin/selfish build` cannot drift.
      - name: Build
        run: ./bin/selfish build --target ${{ matrix.target }}
        working-directory: OOPS/selfish

      - name: Stage archive
        working-directory: OOPS/selfish
        run: |
          dir="dist/${{ steps.meta.outputs.staged }}"
          mkdir -p "$dir"
          cp "target/${{ matrix.target }}/release/selfish${{ matrix.suffix }}" "$dir/"
          cp README.md LICENSE-MIT LICENSE-APACHE "$dir/"

      - name: Pack (zip)
        if: matrix.archive == 'zip'
        shell: pwsh
        working-directory: OOPS/selfish/dist
        run: Compress-Archive -Path "${{ steps.meta.outputs.staged }}" -DestinationPath "selfish-${{ matrix.friendly }}.zip"

      - name: Pack (tar.gz)
        if: matrix.archive == 'tar.gz'
        working-directory: OOPS/selfish/dist
        run: tar -czf "selfish-${{ matrix.friendly }}.tar.gz" "${{ steps.meta.outputs.staged }}"

      - uses: actions/upload-artifact@v4
        with:
          name: selfish-${{ matrix.friendly }}
          path: OOPS/selfish/dist/selfish-${{ matrix.friendly }}.${{ matrix.archive }}
          if-no-files-found: error

  release-tag:
    name: Draft release (tag)
    if: |
      always() && needs.build.result == 'success' &&
      (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v'))
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Resolve tag
        id: meta
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: SELFish ${{ steps.meta.outputs.tag }}
          draft: true
          generate_release_notes: true
          files: dist/*

  release-rolling:
    name: Refresh latest-main release
    if: |
      always() && needs.build.result == 'success' &&
      github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Delete previous latest-main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release delete latest-main --yes --cleanup-tag --repo "${{ github.repository }}" || true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-main
          name: "Latest main build"
          prerelease: true
          make_latest: "false"
          draft: false
          target_commitish: ${{ github.sha }}
          body: |
            Auto-built from `main` at `${{ github.sha }}`.

            One binary, `selfish`: read the platform's own file formats, and write them.
            `selfish <command> --help` is the authority on flags - it is generated from the
            code, so it cannot drift from it.

            It works on the public fake-package keyset only. Nothing here operates on retail
            material, and nothing here should be made to.
          files: dist/*
