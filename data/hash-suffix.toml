# The NID hash suffix.
#
# read-from: community NID documentation, resolver tools and IDA plugins - not a single project.
#            It is self-verifying against published (name, NID) pairs, so the origin matters less
#            than usual (see "It proves itself" below).
#
# A console loader imports by NID rather than by name:
#
#     NID = first 8 bytes of SHA-1(name || suffix), packed so digest[0] is the LEAST
#           significant byte of the u64
#
# then encoded as eleven characters of a 64-symbol alphabet, two padding bits at the
# bottom. `suffix` is the sixteen bytes at the end of this file.
#
# ## Provenance
#
# This value is public knowledge and has been for over a decade. It is described in
# community documentation of the format, implemented in publicly available NID
# resolver tools and IDA plugins, and carried in a hashcat mode for the same purpose.
# It was not taken from any binary by this project.
#
# ## It proves itself - you do not have to trust the source
#
# That is the important part, and it is why the origin being community documentation
# rather than a formal specification does not matter much.
#
# A published (name, identifier) pair exists:
#
#     sceKernelLoadStartModule  ->  wzvqT4UqKX8
#
# Hash that published name with the constant below, encode it, and you get that
# published identifier. Nothing else does. A wrong suffix, a wrong byte order, a wrong
# alphabet or wrong bit packing each produce a different eleven-character string, so
# one pair pins the whole chain simultaneously.
#
# `python3 tools/nid.py selftest` runs exactly that check, and fails if any part of it
# drifts. Reproduction needs nothing from a console: a published name, a published
# identifier, and SHA-1.
#
# ## What it is not
#
# Not a cryptographic key. It decrypts nothing, signs nothing, authenticates nothing.
# It is a salt on a name-mangling hash whose only effect is to make the mapping from
# names to identifiers non-obvious. It is one constant - not per-title, not
# per-firmware, not per-generation.
#
# ## Byte order is where this goes wrong
#
# **`digest[0]` is the least significant byte of the `u64`, here.** Said that way rather than
# with an endian word, for the reason the next section gives: an endian word describes the
# packing, the packing is what differs between two correct readers, and so the warning mirrors.
# Naming which end of the *digest* cannot. Orbistoun now words its own the same way, from the
# other end (`digest[0]` most significant), which is what makes the two comparable at a glance.
#
# Get it wrong *within one pipeline* and the failure is nasty:
# the other order yields an equally plausible value that encodes to a perfectly ordinary
# symbol name and resolves nothing, so every import fails silently and the symptom looks
# like a broken loader rather than a reversed integer.
#
# ### The other convention is not a bug, and this file used to say it was
#
# This paragraph read: *"the emulator side of this project documents it as big-endian;
# that is incorrect"*. That was an accusation made from a label rather than a meaning, and
# it was wrong.
#
# Orbistoun reads the same eight bytes **big-endian** and hashes big-endian to match, so its
# `u64` is the byte-reverse of this one and everything it does with it is self-consistent.
# Its own note records the same discovery this one does, in the mirror: *"reading the digest
# little-endian produces a perfectly plausible hash that agrees with nothing"*. Both are
# true, locally, and both were written as though they were universal.
#
# A differential across 29 modules settled it: every encoded import matches between the two
# readers, byte-reversed, with no module mixing the two. Neither is wrong. The `u64` is an
# internal representation and the two projects unpack the same bytes into it differently.
#
# ### So exchange the encoded form, not the number
#
# The eleven characters are what a symbol table actually contains and they carry no
# byte-order ambiguity. `sceKernelLoadStartModule -> wzvqT4UqKX8` is a published pair, and
# both projects produce that string for that name. Under this crate's convention those
# characters decode to `0xc33bea4f852a297f`; the other reading is `0x7f292a854fea3bc3`.
# Whichever a reader produces tells it which convention it is in, with nobody having to be
# wrong. (D096, worklog 055)
#
# Override with `--suffix-file` if this ever turns out to be wrong for some module.

suffix_hex = "518D64A635DED8C1E6B039B1C3E55230"
