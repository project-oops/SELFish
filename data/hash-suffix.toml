# The NID hash suffix.
#
# read-from: community NID documentation, resolver tools and IDA plugins - not a single project.
#            It is self-verifying against published (name, NID) pairs, so the origin matters less
#            than usual.
#
# A loader imports by NID rather than by name:
#
#     NID = first 8 bytes of SHA-1(name || suffix), packed so digest[0] is the LEAST
#           significant byte of the u64
#
# then encoded as eleven characters of a 64-symbol alphabet, two padding bits at the bottom.
#
# The value is public: described in community documentation of the format, implemented in NID
# resolver tools and IDA plugins, and carried in a hashcat mode. It was not taken from any
# binary. It verifies itself: the published pair
#
#     sceKernelLoadStartModule  ->  wzvqT4UqKX8
#
# is reproduced only by this suffix with this byte order, alphabet and bit packing, so one pair
# pins the whole chain. `selfish-nid`'s tests check it against that pair and against pairs
# produced by independent implementations.
#
# It is not a cryptographic key: it decrypts, signs and authenticates nothing. It is one salt on
# a name-mangling hash, the same for every title, firmware and generation.
#
# Byte order is stated by which end of the digest lands where, because an endian word describes
# the packing and reads as a contradiction between two correct readers. A reader that packs
# `digest[0]` as the most significant byte holds the byte-reverse of this `u64` and is equally
# self-consistent. Exchange the encoded form, which carries no byte-order ambiguity: under this
# convention `wzvqT4UqKX8` decodes to `0xc33bea4f852a297f`; the other reading is
# `0x7f292a854fea3bc3`. Within one pipeline the wrong order yields ordinary-looking names that
# resolve nothing.

suffix_hex = "518D64A635DED8C1E6B039B1C3E55230"
