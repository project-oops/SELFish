# Target SDK versions for Orbis and Prospero executables.
#
# A caller names a version ("2.000.009", "prospero") instead of an opaque packed hex number,
# and this maps the name to the two 32-bit fields an executable declares. Encoded 0xMMmmppbb
# (major, minor, patch, build).
#
# read-from: OpenOrbis-PS4-Toolchain@0a1aaf9  the PT_SCE_PROCPARAM ORBI structure the version lives in
#            obSCEne 048-selfaudit            the values, read from installed titles' PROCPARAM on-device
#
# The version is a static field in an executable's `PT_SCE_PROCPARAM` segment (type
# `0x61000001`): an `ORBI` block with `sdk_version` (Orbis) at `+0x10` and `sdk_version_second`
# (Prospero) at `+0x14`. The structure is named in the OpenOrbis ELF specification, the source
# `selfish-container`'s `patch_elf_procparam` writes from.
#
# A value is observed by parsing a title's PROCPARAM, without running it. obSCEne's
# `048-selfaudit` does this on the hardware for every eboot under `/user/app`, `/system_ex/app`
# and `/system/vsh/app`, so the census is reproducible against anyone's own installed titles.
#
# Each entry's `source` says how it is known:
#   - `measured`      - read from a named title's PROCPARAM.
#   - `conventional`  - a representative value in common use, not traced to a measured title.
#   - `synthetic`     - not a real title's value; a deliberate choice, with the reason.
#
# `min_firmware` is the firmware a target implies, for the caller's guidance; it is not part of
# the PROCPARAM and is conventional throughout.

[sdks."2.000.009"]
generation = 5
alias = "prospero, prospero-default"
orbis_sdk = "08.050.001"
ppr_sdk = "02.000.009"
min_firmware = "2.00"
source = "measured: retail PPSA03416's PT_SCE_PROCPARAM"
description = "Universal safe Prospero target"

[sdks."11.600.005"]
generation = 5
alias = "prospero-current, trinity"
orbis_sdk = "12.590.001"
ppr_sdk = "11.600.005"
min_firmware = "11.60"
source = "conventional: a representative recent-firmware Prospero value, not traced to a specific title measured here"
description = "Modern Prospero target (FW 11.xx/12.xx)"

[sdks."8.008.011"]
generation = 4
alias = "orbis, orbis-default, neo"
orbis_sdk = "08.008.011"
ppr_sdk = "00.000.000"
min_firmware = "8.00"
source = "measured: the value a launching Orbis-generation title declares"
description = "Orbis baseline"

[sdks."0.000.000"]
generation = 4
alias = "zero"
orbis_sdk = "00.000.000"
ppr_sdk = "00.000.000"
min_firmware = "0.00"
source = "synthetic: not a title's value. obSCEne keeps zero for its own module because a real SDK version breaks sceKernelDlsym resolution on the tested hardware; the census-probe baseline"
description = "Zero SDK for D244 census probing"
