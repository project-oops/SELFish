# The two keys behind `sce_sys/keystone`.
#
# Every real package carries a 96-byte `keystone` in its filesystem, and it is **derived from
# the passcode** rather than being title content:
#
#     header      "keystone" 02 00 01 00, then zeros to 32 bytes
#     fingerprint HMAC-SHA256(keystone_hmac_key, passcode)
#     final       HMAC-SHA256(keystone_mac_data, header || fingerprint)
#
# So it is a format product, not something a caller supplies. `selfish-pkg::keystone` builds it
# and the CLI puts one in every image it lays out. (D067)
#
# ## Provenance
#
# LibOrbisPkg `LibOrbisPkg/Util/Keys.cs`, `keystone_hmac_key` and `keystone_mac_data`, with the
# construction in `Util/Crypto.cs` `CreateKeystone`. Extracted by a parser rather than
# transcribed, for the same reason as the moduli above.
#
# These are MAC keys over a passcode a builder chose. They open nothing.
keystone_hmac_key_hex = "c74405f67424ba342bc1276251bbc2f555f16025b6a1b6714780dbaec852fa2f"
keystone_mac_data_hex = "783d6f3ae91c0e0712fcaab7950bde06855cf7a22dcdbde127e9bfcbad0ff0fe"
