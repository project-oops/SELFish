# The public fake-package keyset.
#
# Three RSA-2048 keypairs as modulus and private exponent, one AES key, and seven RSA public
# moduli. Together they read *and* write a **fake** package - one built by a community tool
# rather than signed by the vendor.
#
# ## What each is for
#
# | key | reads | writes |
# |---|---|---|
# | `fake_*` | unwraps the image key | - |
# | `dk3_*` | unwraps the key that decrypts entries | - |
# | `debugrif_*` | checks a licence signature | signs one, saying *debug* (D047) |
# | `rif_secret_key_hex` | decrypts a licence's secret field | encrypts it |
# | `pkg_public_0..6` | - | wraps the per-index keys at entry `0x10` and `0x20` (D054) |
#
# The seven `pkg_public_*` are **public halves only**. A public key wraps and cannot unwrap, so
# they add the ability to write a blob and no ability to read anything that was not already
# readable.
#
# ## Provenance
#
# Published in LibOrbisPkg, an open-source packaging tool, and carried by every open-source
# extractor since. Reached here by way of prosperity@3475257
# (`tools/pkg_extract/pkg_extract.py`), which states the same origin in its own header.
#
# **Not taken from any binary by this project**, and not usable on anything that was not
# already built with them.
#
# ## What they are not
#
# These do not open a retail package. A retail image key is encrypted under a key nobody
# outside the vendor has, and the extractor these came from says so plainly: *"Retail pkgs
# (Sony-signed image_key) are not supported."* That is a wall rather than a gap, in the same
# way retail signing is, and nothing here should be made to climb it.
#
# ## Why committed rather than fetched
#
# Same reasoning as the hash suffix beside it. A build that reaches the network to compute a
# constant is a build that behaves differently depending on where it is run, and these have
# been public for years - the secrecy that would justify keeping them out is long gone.
#
# `dk3` unwraps the entry-keys blob; `fake` unwraps the image key that the first one, hashed
# with the image-key entry's own table row, decrypts.

