# ## The debug RIF keyset, and the key over a licence's secret
#
# A third keypair and one AES key, for the licence entries a package carries. Same origin as
# the two above - LibOrbisPkg names them `DebugRifKeyset` and `rif_debug_key` - and read from
# `LibOrbisPkg/Util/Keys.cs` directly rather than transcribed.
#
# **That distinction is not pedantry.** An earlier attempt to obtain this key through a
# summarising reader produced 519 hex characters where 512 were needed, and two further
# attempts returned overlapping byte ranges. A key that is nearly right signs nothing and looks
# exactly like one that is right. (D047)
#
# ### Confirmed against real material
#
# Signing `sha256` of the first `0x400` bytes of a decrypted licence with `debugrif` reproduces
# that licence's stored signature **byte for byte, in all three packages**, under PKCS#1 v1.5
# with a DigestInfo prefix. Re-run it with `selfish licence --verify <package>`.
#
# These sign nothing retail. A debug RIF is what a fake package carries and what a console
# accepts only where fake packages are accepted at all.
